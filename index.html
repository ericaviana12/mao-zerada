<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mão Zerada</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Mão Zerada</h1>
  <p class="slogan">Zerar a mão é arte — e cálculo faz parte!</p>

  <div class="info">
    <p>Sua mão: <span id="player-sum">0</span></p>
    <p>Mão do Bot: <span id="bot-sum">?</span></p>
  </div>

  <div class="game-area">
    <div class="hand" id="player-hand"></div>

    <div class="middle-area">
      <div class="draw-pile" id="draw-pile" title="Comprar uma carta">Comprar</div>
      <div class="discard-pile" id="discard-pile" title="Última carta descartada"></div>
    </div>

    <div class="bot-area" id="bot-hand"></div>
  </div>

  <div id="message"></div>
  <div class="actions">
    <button onclick="startGame()">Nova Rodada</button>
  </div>

  <div id="victory-modal" class="modal hidden">
    <div class="modal-content">
      <h2 id="winner-text"></h2>
      <button onclick="closeModal()">Fechar</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
