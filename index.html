<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mão Zerada</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Mão Zerada</h1>
  <div id="turno-indicador"></div>
  <div id="mesa">
    <div id="mao-jogador" class="mao"></div>
    <div id="controle-jogador">
      <button onclick="comprarCarta()">Comprar</button>
      <div id="carta-comprada"></div>
    </div>
    <div id="mao-bot" class="mao"></div>
    <div id="descarte">
      <h3>Descarte</h3>
      <div id="pilha-descarte"></div>
    </div>
  </div>
  <button onclick="novaRodada()">Nova Rodada</button>

  <div id="modal-vitoria" class="modal">
    <div class="modal-conteudo">
      <p id="mensagem-vitoria"></p>
      <button onclick="fecharModal()">Fechar</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
